</head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between"><button aria-label="Back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-low transition-colors" onclick="parent.postMessage({type:'aurum-navigate',page:'records'}, '*')"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><h1 class="font-title-lg text-title-lg text-on-surface truncate px-space-sm">Scan A Report</h1><div class="w-11 h-11 flex items-center justify-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full px-margin-mobile pt-16 pb-safe bg-surface"><div class="flex flex-col w-full gap-space-md pb-space-lg">

<!-- Dark Translucent Framing Overlay -->
<div class="absolute inset-0 bg-on-surface/35 pointer-events-none"></div>
<!-- Grid Overlay (Hidden by default, toggled via JS) -->
<div class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-300 grid grid-cols-3 grid-rows-3" id="grid-overlay">
<div class="bg-surface/5"></div>
<div class="bg-transparent"></div>
<div class="bg-surface/5"></div>
<div class="bg-transparent"></div>
<div class="bg-surface/5"></div>
<div class="bg-transparent"></div>
<div class="bg-surface/5"></div>
<div class="bg-transparent"></div>
<div class="bg-surface/5"></div>
</div>
<!-- Top Controls inside Viewfinder -->
<div class="relative z-10 flex items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-xs">
<button aria-label="Toggle Flash" class="w-10 h-10 rounded-full bg-on-surface/60 backdrop-blur-md text-on-primary flex items-center justify-center transition-transform active:scale-95" id="flash-btn" type="button">
<span class="material-symbols-outlined text-[20px]">flash_off</span>
</button>
<button aria-label="Toggle Grid" class="w-10 h-10 rounded-full bg-on-surface/60 backdrop-blur-md text-on-primary flex items-center justify-center transition-transform active:scale-95" id="grid-btn" type="button">
<span class="material-symbols-outlined text-[20px]">grid_on</span>
</button>
</div>
<!-- Auto-Crop Badge -->
<div class="px-space-sm py-1.5 rounded-full bg-on-surface/60 backdrop-blur-md text-on-primary flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-tertiary-fixed">crop_free</span>
<span class="font-label-sm text-label-sm">Auto-Crop</span>
</div>
</div>
<!-- Center Alignment Frame & Status Pill -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center my-space-sm">
<!-- Status Pill -->
<div class="mb-space-md px-space-md py-1.5 rounded-full bg-on-surface/75 backdrop-blur-md text-on-primary flex items-center gap-2 shadow-sm">
<span class="w-2 h-2 rounded-full bg-tertiary-fixed animate-pulse"></span>
<span class="font-label-md text-label-md">Document Detected • Hold Steady</span>
</div>
<!-- Corner Alignment Brackets -->
<div class="relative w-full max-w-[260px] aspect-[3/4] flex items-center justify-center">
<!-- Top-Left Bracket -->
<div class="absolute top-0 left-0 w-7 h-7 rounded-tl-lg bg-transparent shadow-[-3px_-3px_0_0_#8bf7ce]"></div>
<!-- Top-Right Bracket -->
<div class="absolute top-0 right-0 w-7 h-7 rounded-tr-lg bg-transparent shadow-[3px_-3px_0_0_#d6baff]"></div>
<!-- Bottom-Left Bracket -->
<div class="absolute bottom-0 left-0 w-7 h-7 rounded-bl-lg bg-transparent shadow-[-3px_3px_0_0_#d6baff]"></div>
<!-- Bottom-Right Bracket -->
<div class="absolute bottom-0 right-0 w-7 h-7 rounded-br-lg bg-transparent shadow-[3px_3px_0_0_#8bf7ce]"></div>
<!-- Subtle Scan Line -->
<div class="w-full h-0.5 bg-gradient-to-r from-transparent via-tertiary-fixed to-transparent opacity-80 transition-transform duration-1000 ease-in-out" id="scan-line"></div>
</div>
</div>
<!-- Subtle Bottom Viewfinder Hint -->
<div class="relative z-10 flex justify-center">
<span class="font-body-sm text-body-sm text-on-primary/80 bg-on-surface/50 backdrop-blur-sm px-space-sm py-1 rounded-full">
        Align all 4 corners within frame
      </span>
</div>
</div>
<!-- Document Type Selector Pills -->
<div class="flex items-center justify-center gap-space-sm bg-surface-container-low p-1.5 rounded-full">
<button class="doc-pill flex-1 py-2 px-space-sm rounded-full bg-surface-container-lowest text-primary font-label-md text-label-md shadow-sm transition-all" data-doc-type="Lab Report" type="button">
      Lab Report
    </button>
<button class="doc-pill flex-1 py-2 px-space-sm rounded-full bg-transparent text-on-surface-variant font-label-md text-label-md transition-all" data-doc-type="Prescription" type="button">
      Prescription
    </button>
<button class="doc-pill flex-1 py-2 px-space-sm rounded-full bg-transparent text-on-surface-variant font-label-md text-label-md transition-all" data-doc-type="Imaging" type="button">
      Imaging
    </button>
</div>
<!-- Bottom Capture Bar -->
<div class="flex items-center justify-between px-space-sm pt-space-xs">
<!-- Upload PDF / Image Button -->
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors min-w-0" id="upload-btn" type="button">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[22px]">upload_file</span>
</div>
<span class="font-label-sm text-label-sm truncate">Upload PDF</span>
</button>
<!-- Large Circular Shutter "Take Photo" Button -->
<button aria-label="Take Photo" class="relative w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center shadow-md active:scale-95 transition-transform" id="shutter-btn" type="button">
<div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</button>
<!-- Preview (1) Thumbnail -->
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors min-w-0" id="preview-btn" type="button">
<div class="relative w-12 h-12 rounded-xl overflow-hidden bg-surface-container shadow-sm">
<img class="w-full h-full object-cover" data-alt="A miniature crisp white clinical lab report thumbnail with soft lavender accents and clean typography, photographed in bright natural studio light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZ_5eZd1VsnKo_4mWmWJUBHpq1HrveqX8cuGiCXgT44TV7jCuJQZCG9Z2iOzlmn4S8OvU2xdYkAOqs2AFvL9DrQCT-fipkmDAcQ7mF2tCpRzsKd80UllvPwK9D0K0dUL_xtb1enzFOvycTz7WxSbUpBaTZTmoilWVDXHI7nSrn1DMJ-HPCuyvN16SMHPIzvmWSnPTVW-2ru8vOm56mN5YJVbrxNAcMcFumCVQciaI"/>
<span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm flex items-center justify-center shadow-sm" id="preview-count">
          0
        </span>
</div>
<span class="font-label-sm text-label-sm truncate">Preview (0)</span>
</button>
</div>
<!-- Reassurance Note -->
<div class="flex items-center justify-center gap-1.5 pt-space-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-tertiary">verified_user</span>
<p class="font-body-sm text-body-sm">
      College project demo • Uploaded scans are saved in Records
    </p>
</div>
</div>
<script>
  (function () {
    const flashBtn = document.getElementById('flash-btn');
    const gridBtn = document.getElementById('grid-btn');
    const gridOverlay = document.getElementById('grid-overlay');
    const docPills = document.querySelectorAll('.doc-pill');
    const shutterBtn = document.getElementById('shutter-btn');
    const previewCount = document.getElementById('preview-count');
    const previewLabel = document.querySelector('#preview-btn span.font-label-sm:last-child');
    const scanLine = document.getElementById('scan-line');

    let flashOn = false;
    let gridOn = false;

    flashBtn.addEventListener('click', () => {
      flashOn = !flashOn;
      const icon = flashBtn.querySelector('.material-symbols-outlined');
      icon.textContent = flashOn ? 'flash_on' : 'flash_off';
      flashBtn.classList.toggle('bg-primary', flashOn);
      flashBtn.classList.toggle('bg-on-surface/60', !flashOn);
    });

    gridBtn.addEventListener('click', () => {
      gridOn = !gridOn;
      gridOverlay.classList.toggle('opacity-0', !gridOn);
      gridOverlay.classList.toggle('opacity-100', gridOn);
      gridBtn.classList.toggle('bg-primary', gridOn);
      gridBtn.classList.toggle('bg-on-surface/60', !gridOn);
    });

    docPills.forEach((pill) => {
      pill.addEventListener('click', () => {
        docPills.forEach((p) => {
          p.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
          p.classList.add('bg-transparent', 'text-on-surface-variant');
        });
        pill.classList.remove('bg-transparent', 'text-on-surface-variant');
        pill.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
      });
    });


    let scanDown = true;
    setInterval(() => {
      scanLine.style.transform = scanDown ? 'translateY(80px)' : 'translateY(-80px)';
      scanDown = !scanDown;
    }, 1200);
  })();
</script></main><script src="../app-client.js"></script>
</body></html>
